[project]
name = "decision-service"
version = "0.1.0"
description = "stonksAI decision service. For now: NSE/BSE announcement ingestion and a source-comparison poller."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only, so far

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]  # the PostgreSQL driver
documents = ["pypdf[crypto]>=4"]  # reading PDF text in the document test; crypto opens AES-encrypted PDFs

[project.scripts]
stonks-sources = "decision_service.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["decision_service*"]
