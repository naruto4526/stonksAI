[project]
name = "decision-service"
version = "0.1.0"
description = "stonksAI decision service. For now: NSE/BSE announcement ingestion and a source-comparison poller."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only, so far

[project.optional-dependencies]
documents = ["pypdf>=4"]  # reading PDF text in the document test

[project.scripts]
stonks-sources = "decision_service.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["decision_service*"]
